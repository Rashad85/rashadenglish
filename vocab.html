<style>
/* Layout: phone-first app shell — brand bar on top, one scrolling screen, tab bar pinned to the bottom */
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --ink: #13294B; --text: #1E2A33; --muted: #5E6B70; --line: #DCE3E0;
  --brand: #1E5B4A; --brand-deep: #154437; --on-brand: #FFFFFF; --on-brand-muted: #B8D4C8;
  --accent: #E8641B; --accent-soft: #FDEEE3; --brand-soft: #E3F1EB; --navy-soft: #E8EDF6;
  --good: #1E7A52; --bad: #C2410C; --shadow: 0 12px 30px -20px rgba(19, 41, 75, .45);
  --f-display: "Noto Serif", Georgia, "Times New Roman", serif;
  --f-ui: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px; --tab-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1513; --surface: #16211E; --ink: #E7EEF7; --text: #DCE5E2; --muted: #93A4A0; --line: #273632;
  --brand: #1E5B4A; --brand-deep: #123A30; --on-brand: #FFFFFF; --on-brand-muted: #A9C9BC;
  --accent: #FF8A47; --accent-soft: #33231A; --brand-soft: #1B2F28; --navy-soft: #1B2433;
  --good: #5FBF9B; --bad: #FF8A5C; --shadow: 0 12px 30px -20px rgba(0, 0, 0, .8); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1513; --surface: #16211E; --ink: #E7EEF7; --text: #DCE5E2; --muted: #93A4A0; --line: #273632;
  --brand: #1E5B4A; --brand-deep: #123A30; --on-brand: #FFFFFF; --on-brand-muted: #A9C9BC;
  --accent: #FF8A47; --accent-soft: #33231A; --brand-soft: #1B2F28; --navy-soft: #1B2433;
  --good: #5FBF9B; --bad: #FF8A5C; --shadow: 0 12px 30px -20px rgba(0, 0, 0, .8); color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
body { background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand) }
button { font: inherit; color: inherit; cursor: pointer }
a { color: inherit }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); margin: 0; text-wrap: balance }

/* brand bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--on-brand) }
.appbar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
.logo { width: 42px; height: 42px; border-radius: 12px; background: var(--on-brand); display: grid; place-items: center; position: relative; flex: none }
.logo b { font-family: var(--f-display); font-weight: 700; font-size: 19px; color: #1E5B4A; letter-spacing: -0.04em }
.logo i { position: absolute; right: 6px; bottom: 6px; width: 7px; height: 7px; border-radius: 50%; background: #E8641B }
.brandtx { min-width: 0; display: grid; line-height: 1.2 } .brandtx span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.brandtx strong { font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .01em }
.brandtx span { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--on-brand-muted) }
.appbar .back { margin-left: auto; background: rgba(255, 255, 255, .14); border: 0; color: var(--on-brand); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .88rem }

.screen { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)) }

/* hero */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 24px; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; box-shadow: var(--shadow) }
.hero h1 { color: var(--on-brand); font-size: clamp(1.35rem, 5vw, 1.7rem); line-height: 1.2 }
.hero p { margin: 6px 0 0; color: var(--on-brand-muted); font-size: .9rem }
.ring { width: 96px; height: 96px; position: relative }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05 }
.ring .v b { font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums }
.ring .v span { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--on-brand-muted) }
.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.kpi { background: rgba(255, 255, 255, .1); border-radius: 12px; padding: 8px 10px }
.kpi b { display: block; font-family: var(--f-display); font-size: 1.15rem; font-variant-numeric: tabular-nums }
.kpi span { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--on-brand-muted) }

.cta { margin-top: 14px; display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px }
.cta p { margin: 0; flex: 1; min-width: 0 } .cta b { color: var(--accent) }
.sect { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 2px 10px }
.sect h2 { font-size: 1.2rem } .sect span { color: var(--muted); font-size: .82rem }

/* category tiles */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; box-shadow: var(--shadow) }
.tile:active { transform: scale(.98) }
.glyph { white-space: nowrap; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem }
.g0 { background: var(--brand-soft); color: var(--brand) } .g1 { background: var(--accent-soft); color: var(--accent) } .g2 { background: var(--navy-soft); color: var(--ink) }
:root[data-theme="dark"] .g0 { color: #5FBF9B }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .g0 { color: #5FBF9B } }
.tile .t { font-weight: 700; color: var(--ink); line-height: 1.25 }
.tile .m { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px }

/* lists */
.sub { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 18px 2px 8px }
.rows { display: grid; gap: 8px }
.rowb { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0 }
.rowb .t { font-weight: 600; color: var(--ink); overflow-wrap: anywhere } .rowb .p { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums }
.rowb .bar { grid-column: 1 / -1 }
.headx { margin: 4px 2px 14px } .headx h1 { font-size: 1.55rem } .headx p { margin: 4px 0 0; color: var(--muted) }

.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface) }
.seg button { flex: 1; border: 0; background: none; padding: 8px 10px; border-radius: 999px; font-size: .85rem; color: var(--muted); font-weight: 500 }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600 }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 10px; text-align: center; display: grid; gap: 6px; justify-items: center; min-width: 0; box-shadow: var(--shadow) }
.mode .glyph { width: 40px; height: 40px }
.mode b { color: var(--ink) } .mode span { font-size: .74rem; color: var(--muted); line-height: 1.3 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 14px; overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .92rem }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
td.w { font-weight: 600; color: var(--ink) } .x { color: var(--muted); font-size: .8rem } td.bx { width: 22px; padding-right: 0 }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); padding: 10px 2px 4px }

/* session */
.sess-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; font-weight: 600 }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px } .prog i { display: block; height: 100%; background: var(--accent); transition: width .25s }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; min-height: 290px; display: grid; place-items: center; text-align: center; padding: 34px 22px; box-shadow: var(--shadow) }
.card::after { content: "RN"; position: absolute; left: 16px; top: 12px; font-family: var(--f-display); font-weight: 700; font-size: .8rem; color: var(--line); letter-spacing: -.03em }
.card.flip { cursor: pointer }
.q { font-family: var(--f-display); font-size: clamp(1.6rem, 6.5vw, 2.5rem); color: var(--ink); line-height: 1.2; overflow-wrap: anywhere }
.qs { color: var(--muted); margin-top: 8px; font-size: .95rem }
.ans { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); width: 100% }
.ans .a { font-family: var(--f-display); font-size: clamp(1.25rem, 4.8vw, 1.8rem); color: var(--good); overflow-wrap: anywhere }
.ans .as { color: var(--muted); margin-top: 6px }
.hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .8rem; color: var(--muted) }
.say { position: absolute; top: 10px; right: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink) }
.say svg { width: 18px; height: 18px }
.btn { border: 0; border-radius: 16px; padding: 14px 18px; font-weight: 700; background: var(--brand); color: #fff; font-size: 1rem }
.btn.alt { background: var(--accent) } .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line) }
.btn.sm { padding: 9px 14px; border-radius: 999px; font-size: .88rem }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px }
.opts { display: grid; gap: 8px; margin-top: 14px }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 15px; font-size: 1rem; overflow-wrap: anywhere }
.opt.ok { border-color: var(--good); background: var(--brand-soft); color: var(--good); font-weight: 700 }
.opt.no { border-color: var(--bad); background: var(--accent-soft); color: var(--bad) }
.opt:disabled { cursor: default }
.type { display: flex; gap: 8px; margin-top: 14px }
.type input { flex: 1; min-width: 0; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); font: inherit; font-size: 1.05rem }
.fb { margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-weight: 500 }
.fb.ok { background: var(--brand-soft); color: var(--good) } .fb.no { background: var(--accent-soft); color: var(--bad) }
.next { margin-top: 12px; width: 100% }
.res { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 26px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow) }
.res .big { font-family: var(--f-display); font-size: 3.4rem; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums }
.miss { text-align: left; width: 100%; padding-left: 18px } .miss li { margin: 4px 0 }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
.search { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); font: inherit; font-size: 1rem; margin-bottom: 14px }
.empty { color: var(--muted); text-align: center; padding: 30px 10px }

/* contact */
.bcard { background: var(--brand); color: var(--on-brand); border-radius: 26px; padding: 26px 22px; display: grid; gap: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden }
.bcard::after { content: "RN"; position: absolute; right: -10px; bottom: -40px; font-family: var(--f-display); font-weight: 700; font-size: 150px; line-height: 1; color: rgba(255, 255, 255, .06); letter-spacing: -.06em }
.bcard .logo { width: 64px; height: 64px; border-radius: 18px } .bcard .logo b { font-size: 28px } .bcard .logo i { width: 10px; height: 10px; right: 9px; bottom: 9px }
.bcard h1 { color: var(--on-brand); font-size: 1.6rem } .bcard .tag { display: inline-block; background: #E8641B; color: #fff; font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; margin-top: 8px }
.bcard p { margin: 0; color: var(--on-brand-muted) }
.clist { display: grid; gap: 10px; margin-top: 14px }
.citem { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-decoration: none; min-width: 0 }
.citem .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none }
.citem .ic svg { width: 22px; height: 22px }
.citem .tx { min-width: 0; flex: 1; display: grid } .citem .tx span { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em }
.citem .tx b { color: var(--ink); font-size: 1.05rem; user-select: all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
.copied { font-size: .8rem; color: var(--good); font-weight: 600 }
.strip { margin-top: 26px; text-align: center; font-size: .8rem; color: var(--muted); display: grid; gap: 2px }
.strip b { color: var(--ink) }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
.tabs-in { max-width: 720px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(4, 1fr) }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: .72rem; font-weight: 600; position: relative }
.tab svg { width: 23px; height: 23px }
.tab[aria-current="page"] { color: var(--brand) }
:root[data-theme="dark"] .tab[aria-current="page"] { color: #5FBF9B }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-current="page"] { color: #5FBF9B } }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--accent); color: #fff; border-radius: 999px; font-size: .62rem; padding: 1px 6px; font-variant-numeric: tabular-nums }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr) } }
@media (max-width: 360px) { .modes { grid-template-columns: 1fr } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

function qa(d, it, dir) {
  const [f, b, x] = it;
  if (d.kind === 'verb') return dir ? { q: x, qs: 'Feili yazın: V1', a: `${f} – ${b}`, chk: f, as: '', sayA: f } : { q: f, qs: 'V2 – V3 ?', a: b, chk: b, as: x, sayQ: f, sayA: b };
  if (d.kind === 'syn' || d.kind === 'ant') {
    const w = d.kind === 'syn' ? 'sinonimi' : 'antonimi';
    return dir ? { q: b, qs: w + ' hansıdır?', a: f, chk: f, as: x, sayQ: b, sayA: f } : { q: f, qs: w + ' hansıdır?', a: b, chk: b, as: x, sayQ: f, sayA: b };
  }
  return dir ? { q: b, qs: 'İngiliscə necədir?', a: f, chk: f, as: x, sayA: f } : { q: f, qs: x, a: b, chk: b, as: '', sayQ: f };
}
const norm = s => s.toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/^\s*(to|a|an|the)\s+/g, '').replace(/[.!?'’"“”]/g, '').replace(/\s+/g, ' ').trim();
function correct(input, chk) {
  const i = norm(input).replace(/[–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!i) return false;
  const whole = norm(chk).replace(/[–—-]/g, ' ').replace(/[,;/]/g, ' ').replace(/\s+/g, ' ').trim();
  if (i === whole) return true;
  return chk.split(/[,;/]|\s–\s/).map(v => norm(v)).filter(Boolean).some(v => v === i || v.replace(/^to /, '') === i.replace(/^to /, ''));
}

}

let view = { name: 'home', tab: 'home' };
let CUR_BACK = null;
function go(v) { view = v; try { const st = history.state && history.state.b; if (v.name !== 'home' && !st) history.pushState({ b: 1 }, ''); else if (v.name === 'home' && st) history.back(); } catch (e) {} render(); }
try { history.replaceState({ b: 0 }, ''); } catch (e) {}
window.addEventListener('popstate', () => {
  if (view.name === 'home' || !CUR_BACK) return;
  const t = CUR_BACK; view = t; try { if (t.name !== 'home') history.pushState({ b: 1 }, ''); } catch (e) {} render();
});
function shell(inner, backTo) {
  CUR_BACK = backTo || (view.name === 'home' ? null : { name: 'home', tab: 'home' });
  const wk = weak().length, t = view.tab || 'home';
  const tab = (id, label, ic) => `<button class="tab" data-tab="${id}" ${t === id ? 'aria-current="page"' : ''}>${ic}<span>${label}</span>${id === 'rep' && wk ? `<span class="badge">${wk}</span>` : ''}</button>`;
  return `<header class="appbar"><div class="appbar-in">${logo()}<div class="brandtx"><strong>RN Vocabulary</strong><span>Rəşad Nəsibov · Abituriyent hazırlığı</span></div>
      ${backTo ? `<button class="back" id="bk">← Geri</button>` : ''}</div></header>
    <main class="screen">${inner}</main>
    <nav class="tabs" aria-label="Bölmələr"><div class="tabs-in">${tab('home', 'Əsas', ICON.home)}${tab('rep', 'Təkrar', ICON.rep)}${tab('find', 'Axtar', ICON.find)}${tab('me', 'Əlaqə', ICON.me)}</div></nav>`;
}
function bindShell(backTo) {
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    const id = b.dataset.tab;
    if (id === 'home') go({ name: 'home', tab: 'home' }); else if (id === 'rep') go({ name: 'rep', tab: 'rep' });
    else if (id === 'find') go({ name: 'find', tab: 'find', q: '' }); else go({ name: 'me', tab: 'me' });
  });
  const bk = $('#bk'); if (bk && backTo) bk.onclick = () => go(backTo);
}
function render() {
  const v = view.name;
  ({ home, grp: grpView, deck: deckView, sess: sessView, res: resView, rep: repView, find: findView, me: meView })[v]();
  window.scrollTo(0, 0);
}
function ring(p) {
  const r = 42, c = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#E8641B" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/></svg>
    <div class="v"><div><b>${Math.round(p * 100)}%</b><br><span>öyrənilib</span></div></div></div>`;
}
const groupStat = g => { const ds = DECKS.filter(d => d.grp === g); const n = ds.reduce((s, d) => s + d.items.length, 0), m = ds.reduce((s, d) => s + deckStat(d).m, 0); return { ds, n, m, p: n ? m / n : 0 }; };
function home() {
  const all = DECKS.reduce((s, d) => s + d.items.length, 0), m = DECKS.reduce((s, d) => s + deckStat(d).m, 0), seen = Object.keys(P).length, wk = weak().length;
  let h = `<section class="hero"><div><h1>Bu gün hansı sözləri öyrənirik?</h1><p>Kartlar, test və yazı məşqləri ilə imtahana hazırlaş.</p></div>${ring(all ? m / all : 0)}
      <div class="kpis"><div class="kpi"><b>${m}</b><span>öyrənilib</span></div><div class="kpi"><b>${seen}</b><span>baxılıb</span></div><div class="kpi"><b>${all}</b><span>söz</span></div></div></section>`;
  h += wk ? `<div class="cta"><p><b>${wk}</b> söz təkrar istəyir.</p><button class="btn alt sm" data-tab="rep">Təkrar et</button></div>`
          : `<div class="cta"><p>Bölmə seçin və <b>Kartlar</b> ilə başlayın. Bir sözü 3 dəfə bilsəniz, o, <b>öyrənilmiş</b> sayılır.</p></div>`;
  h += `<div class="sect"><h2>Bölmələr</h2><span>${GROUPS.length} bölmə</span></div><div class="tiles">`;
  for (const g of GROUPS) {
    const s = groupStat(g); if (!s.n) continue; const [gl, cls, sub] = GROUP_META[g];
    h += `<button class="tile" data-grp="${esc(g)}"><span class="glyph ${cls}">${gl}</span><span><span class="t">${g}</span><br><span class="x">${sub}</span></span>
      <span class="bar"><i style="width:${Math.round(s.p * 100)}%"></i></span><span class="m"><span>${s.n} söz</span><span>${Math.round(s.p * 100)}%</span></span></button>`;
  }
  h += `</div><div class="strip"><b>RN · Abituriyent hazırlığı</b><span>Tel: ${PHONE} · Instagram: @${IG}</span></div>`;
  app.innerHTML = shell(h); bindShell();
  app.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => go({ name: 'grp', tab: 'home', g: b.dataset.grp }));
}
function grpView() {
  const g = view.g, s = groupStat(g);
  let h = `<div class="headx"><h1>${g}</h1><p>${s.n} söz · ${s.m} öyrənilib</p></div>`;
  let last = null;
  for (const d of s.ds) {
    if (d.sub !== last) { if (last !== null) h += `</div>`; h += (d.sub ? `<div class="sub">${esc(d.sub)}</div>` : '') + `<div class="rows">`; last = d.sub; }
    const st = deckStat(d);
    h += `<button class="rowb" data-deck="${d.id}"><span class="t">${esc(d.title)}</span><span class="p">${st.m}/${st.n}</span><span class="bar"><i style="width:${Math.round(st.p * 100)}%"></i></span></button>`;
  }
  h += `</div>`;
  app.innerHTML = shell(h, { name: 'home', tab: 'home' }); bindShell({ name: 'home', tab: 'home' });
  app.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => go({ name: 'deck', tab: 'home', id: b.dataset.deck }));
}
function deckView() {
  const d = byId[view.id], s = deckStat(d), L = KIND_LABEL[d.kind];
  const cols = ['var(--accent)', 'var(--accent)', '#E9A23B', '#7FB89A', 'var(--good)', 'var(--good)'];
  const h = `<div class="headx"><h1>${esc(d.title)}</h1><p>${esc(d.grp)}${d.sub ? ' · ' + esc(d.sub) : ''} · ${s.n} söz · ${s.m} öyrənilib</p></div>
    <div class="seg" role="group" aria-label="İstiqamət"><button data-dir="0" aria-pressed="${!PREF.dir}">${L[0]}</button><button data-dir="1" aria-pressed="${!!PREF.dir}">${L[1]}</button></div>
    <div class="modes">
      <button class="mode" data-mode="cards"><span class="glyph g0">▣</span><b>Kartlar</b><span>Çevir və yadda saxla</span></button>
      <button class="mode" data-mode="test"><span class="glyph g1">✓</span><b>Test</b><span>4 variantdan seç</span></button>
      <button class="mode" data-mode="type"><span class="glyph g2">Aa</span><b>Yaz</b><span>Cavabı özün yaz</span></button>
    </div>
    <div class="panel"><table>${d.items.map(it => { const b = box(it.key); return `<tr><td class="bx"><span class="dot" style="${b < 0 ? 'border:1.5px solid var(--line)' : 'background:' + cols[b]}"></span></td><td class="w">${esc(it[0])}</td><td>${esc(it[1])}${it[2] ? `<div class="x">${esc(it[2])}</div>` : ''}</td></tr>`; }).join('')}</table></div>
    <div class="legend"><span><span class="dot" style="border:1.5px solid var(--line);margin:0"></span> baxılmayıb</span><span><span class="dot" style="background:var(--accent);margin:0"></span> təkrar lazımdır</span><span><span class="dot" style="background:var(--good);margin:0"></span> öyrənilib</span></div>`;
  const back = { name: 'grp', tab: 'home', g: d.grp };
  app.innerHTML = shell(h, back); bindShell(back);
  app.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => { PREF.dir = +b.dataset.dir; save(); render(); });
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => start(d, b.dataset.mode));
}
function pickItems(pairs) { return shuffle(pairs.slice()).sort((a, b) => box(a[1].key) - box(b[1].key)).slice(0, SESSION); }
function start(d, mode) { go({ name: 'sess', tab: 'home', mode, items: pickItems(d.items.map(it => [d, it])), i: 0, ok: 0, miss: [], back: { name: 'deck', tab: 'home', id: d.id }, title: d.title }); }
function startWeak(mode = 'cards') { go({ name: 'sess', tab: 'rep', mode, items: pickItems(weak()), i: 0, ok: 0, miss: [], back: { name: 'rep', tab: 'rep' }, title: 'Təkrar' }); }
function options(d, it, dir) {
  const right = qa(d, it, dir).a;
  const pool = d.items.length >= 6 ? d.items : DECKS.filter(x => x.grp === d.grp && x.kind === d.kind).flatMap(x => x.items);
  const outs = shuffle(pool.filter(o => o !== it).map(o => qa(d, o, dir).a).filter(a => a && a !== right));
  return shuffle([right, ...[...new Set(outs)].slice(0, 3)]);
}
function sessView() {
  const S = view;
  if (S.i >= S.items.length) { view = { ...S, name: 'res' }; return render(); }
  const [d, it] = S.items[S.i], dir = PREF.dir, Q = qa(d, it, dir);
  const top = `<div class="sess-top"><span class="count">${esc(S.title)}</span><span class="count">${S.i + 1} / ${S.items.length}</span></div><div class="prog"><i style="width:${S.i / S.items.length * 100}%"></i></div>`;
  const say = (canSpeak && Q.sayQ) ? `<button class="say" id="say" aria-label="Səsləndir">${ICON.spk}</button>` : '';
  const qhtml = `<div><div class="q">${esc(Q.q)}</div>${Q.qs ? `<div class="qs">${esc(Q.qs)}</div>` : ''}`;
  let h;
  if (S.mode === 'cards') {
    const shown = S.shown;
    h = top + `<div class="card ${shown ? '' : 'flip'}" id="cd">${say}${qhtml}${shown ? `<div class="ans"><div class="a">${esc(Q.a)}</div>${Q.as ? `<div class="as">${esc(Q.as)}</div>` : ''}</div>` : ''}</div>
      ${shown ? '' : '<div class="hint">Cavabı görmək üçün toxunun</div>'}</div>
      ${shown ? `<div class="acts"><button class="btn alt" data-k="0">Bilmirəm</button><button class="btn" data-k="1">Bilirəm</button></div>` : `<div class="acts"><button class="btn ghost" id="show" style="grid-column:1/-1">Cavabı göstər</button></div>`}`;
  } else if (S.mode === 'test') {
    if (!S.opts) S.opts = options(d, it, dir);
    h = top + `<div class="card">${say}${qhtml}</div></div><div class="opts">${S.opts.map((o, k) => `<button class="opt" data-o="${k}">${esc(o)}</button>`).join('')}</div><div id="after"></div>`;
  } else {
    h = top + `<div class="card">${say}${qhtml}</div></div><form class="type" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${dir || d.kind === 'verb' ? 'İngiliscə yazın…' : 'Tərcüməni yazın…'}" aria-label="Cavab"><button class="btn" type="submit">Yoxla</button></form><div id="after"></div>`;
  }
  app.innerHTML = shell(h, S.back); bindShell(S.back);
  const sb = $('#say'); if (sb) sb.onclick = e => { e.stopPropagation(); speak(Q.sayQ); };
  const fin = ok => { mark(it.key, ok); if (ok) S.ok++; else S.miss.push([Q.q, Q.a]); };
  if (S.mode === 'cards') {
    const reveal = () => { S.shown = true; render(); };
    if (!S.shown) { $('#cd').onclick = e => { if (!e.target.closest('#say')) reveal(); }; $('#show').onclick = reveal; }
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { fin(b.dataset.k === '1'); S.i++; S.shown = false; render(); });
  } else if (S.mode === 'test') {
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const ok = S.opts[+b.dataset.o] === Q.a;
      app.querySelectorAll('[data-o]').forEach(x => { x.disabled = true; if (S.opts[+x.dataset.o] === Q.a) x.classList.add('ok'); });
      if (!ok) b.classList.add('no'); fin(ok);
      $('#after').innerHTML = `${Q.as ? `<div class="fb ${ok ? 'ok' : 'no'}">${esc(Q.as)}</div>` : ''}<button class="btn next" id="nx">Növbəti</button>`;
      $('#nx').focus(); $('#nx').onclick = () => { S.i++; S.opts = null; render(); };
    });
  } else {
    const inp = $('#ti'); inp.focus();
    $('#tf').onsubmit = e => {
      e.preventDefault(); if (S.done) { S.i++; S.done = false; return render(); }
      const ok = correct(inp.value, Q.chk); S.done = true; inp.disabled = true; fin(ok);
      $('#after').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Düzdür! ' : 'Düzgün cavab: '}<b>${esc(Q.a)}</b>${Q.as ? ` · ${esc(Q.as)}` : ''}</div><button class="btn next" id="nx">Növbəti</button>`;
      $('#nx').focus(); $('#nx').onclick = () => { S.i++; S.done = false; render(); };
    };
  }
}
function resView() {
  const S = view, n = S.items.length, pct = n ? Math.round(S.ok / n * 100) : 0;
  const msg = pct >= 90 ? 'Əla nəticə!' : pct >= 70 ? 'Yaxşıdır, bir az da təkrar.' : 'Bu dəstəni yenidən keçin.';
  const h = `<div class="res"><div class="big">${S.ok} / ${n}</div><h2>${msg}</h2>
    ${S.miss.length ? `<ul class="miss">${S.miss.map(([q, a]) => `<li><b>${esc(q)}</b> — ${esc(a)}</li>`).join('')}</ul>` : ''}

  app.innerHTML = shell(h, S.back); bindShell(S.back);
  $('#bk2').onclick = () => go(S.back);

}
function repView() {
  const w = weak();

  if (!w.length) h += `<div class="panel empty">Hələ təkrar ediləcək söz yoxdur. Bir bölmədə məşq edin — “Bilmirəm” dediyiniz sözlər bura düşəcək.</div>`;
  else h += `<div class="modes"><button class="mode" data-m="cards"><span class="glyph g0">▣</span><b>Kartlar</b><span>${w.length} söz</span></button><button class="mode" data-m="test"><span class="glyph g1">✓</span><b>Test</b><span>4 variant</span></button><button class="mode" data-m="type"><span class="glyph g2">Aa</span><b>Yaz</b><span>Özün yaz</span></button></div>
      <div class="panel"><table>${w.slice(0, 80).map(([d, it]) => `<tr><td class="w">${esc(it[0])}</td><td>${esc(it[1])}<div class="x">${esc(d.grp)} · ${esc(d.title)}</div></td></tr>`).join('')}</table></div>`;
  app.innerHTML = shell(h); bindShell();

function findView() {
  const q = view.q || '';

    const n = norm(q), out = [];
    for (const d of DECKS) { for (const it of d.items) if (norm(it[0]).includes(n) || norm(it[1]).includes(n)) { out.push([d, it]); if (out.length >= 80) break; } if (out.length >= 80) break; }
    res = out.length ? `<div class="panel"><table>${out.map(([d, it]) => `<tr><td class="w">${esc(it[0])}</td><td>${esc(it[1])}${it[2] ? `<div class="x">${esc(it[2])}</div>` : ''}<div class="x">${esc(d.grp)} · ${esc(d.title)}</div></td></tr>`).join('')}</table></div>`
                     : `<div class="panel empty">“${esc(q)}” tapılmadı. Başqa yazılışı yoxlayın.</div>`;
  } else res = `<div class="empty">İngiliscə və ya azərbaycanca yazın: məsələn, <b>brave</b> və ya <b>cəsur</b>.</div>`;
  app.innerHTML = shell(`<div class="headx"><h1>Söz axtar</h1></div><input class="search" id="q" type="search" placeholder="Sözü yazın…" autocomplete="off" value="${esc(q)}"><div id="res">${res}</div>`); bindShell();
  const inp = $('#q'); inp.focus(); inp.setSelectionRange(q.length, q.length);
  inp.oninput = () => { view.q = inp.value; const p = inp.selectionStart; render(); const x = $('#q'); x.setSelectionRange(p, p); };
}
function meView() {
  const h = `<section class="bcard">${logo()}<div><h1>Rəşad Nəsibov</h1><span class="tag">Abituriyent hazırlığı</span></div>
      <p>İngilis dili · qrammatika və söz ehtiyatı. <b style="color:#fff">RN Vocabulary</b> — bütün sözlər “English Grammar &amp; Vocabulary” kitabındandır.</p></section>
    <div class="clist">
      <div class="citem"><span class="ic g0">${ICON.tel}</span><span class="tx"><span>Telefon</span><b>${PHONE}</b></span><button class="btn sm ghost" id="cp">Kopyala</button></div>
      <a class="citem" href="https://www.instagram.com/${IG}/" target="_blank" rel="noopener"><span class="ic g1">${ICON.ig}</span><span class="tx"><span>Instagram</span><b>@${IG}</b></span><span class="x">Aç ↗</span></a>
      <a class="citem" href="tel:${PHONE_TEL}"><span class="ic g2">${ICON.tel}</span><span class="tx"><span>Zəng et</span><b>${PHONE}</b></span><span class="x">↗</span></a>
    </div>

  };
}
render();
